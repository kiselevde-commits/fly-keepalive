name: heartbeat

# GitHub disables scheduled workflows in repositories without activity for
# 60 days. This weekly commit keeps the schedule of ping.yml alive.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat
        run: |
          date -u +%FT%TZ > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat $(date -u +%F)" || exit 0
          git push
